# Flow 1 — MODELO RESOLVIDO
#
# Abre o app, faz login e confirma que a lista de filmes apareceu.

appId: com.puciec.cinefav

---
- launchApp

- runFlow:
    when:
      visible:
        id: "login-screen"
    file: "_fragments/login.yaml"

- assertVisible:
    id: "movielist-screen"

- assertVisible: "Matrix"