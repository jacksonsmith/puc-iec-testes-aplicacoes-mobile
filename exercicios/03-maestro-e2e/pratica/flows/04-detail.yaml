# Flow 4 — Abrir o detalhe do filme, favoritar lá dentro e voltar pra lista.
# Conceito: navegação entre telas + asserções em cada uma.
appId: com.puciec.cinefav
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        id: "login-screen"
    file: _fragments/login.yaml
- assertVisible:
    id: "movielist-screen"
- tapOn:
    id: "movie-card-603"
- assertVisible:
    id: "detail-screen"
- assertVisible:
    id: "detail-title"
- tapOn:
    id: "detail-favorite-button"
- tapOn:
    id: "detail-back-button"
- assertVisible:
    id: "movielist-screen"
