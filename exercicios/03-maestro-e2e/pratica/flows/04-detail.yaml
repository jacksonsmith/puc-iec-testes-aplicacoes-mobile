# Flow 4 — Abrir o detalhe do filme, favoritar lá dentro e voltar pra lista.
# Conceito: navegação entre telas + asserções em cada uma.
appId: com.puciec.cinefav
---
- launchApp
# Login (copiado do flow 01)
- tapOn:
    id: "login-email-input"
- inputText: "aluno@puc.br"
- tapOn:
    id: "login-password-input"
- inputText: "1234"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "movielist-screen"
# Toca no card do filme "Matrix"
- tapOn:
    id: "movie-card-603"
# Confirma que chegou na tela de detalhe
- assertVisible:
    id: "detail-screen"
# Favorita direto no detalhe
- tapOn:
    id: "detail-favorite-button"
# Volta pra lista
- tapOn:
    id: "detail-back-button"
# Confirma que voltou pra tela de lista
- assertVisible:
    id: "movielist-screen"