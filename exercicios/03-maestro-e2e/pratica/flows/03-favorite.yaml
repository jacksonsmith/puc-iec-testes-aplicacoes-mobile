# Flow 3 — Favoritar na lista e verificar na tela de Favoritos (asserção cross-tela).
# Conceito: ação numa tela (favoritar) reflete em outra (Favoritos) + contador.
appId: com.puciec.cinefav
---
- launchApp
# Login (copiado do flow 01)
- tapOn:
    id: "login-email-input"
- inputText: "aluno@puc.br"
- tapOn:
    id: "login-password-input"
- inputText: "1234"
- tapOn:
    id: "login-submit-button"
- assertVisible:
    id: "movielist-screen"
# Favorita o filme "Matrix" tocando no coração do card
- tapOn:
    id: "movie-card-heart-603"
# Abre os Favoritos pelo botão do header
- tapOn:
    id: "movielist-favorites-button"
# Confirma que o item favoritado aparece na tela de Favoritos
- assertVisible:
    id: "favorites-item-603"
# Confirma o contador de favoritos
- assertVisible: "1 favorito"